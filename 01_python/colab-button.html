<script>
  document.addEventListener("DOMContentLoaded", () => {
    const match = decodeURIComponent(window.location.pathname).match(
      /\/Python_AULA(\d+)\.html$/i
    );

    if (!match) return;

    const notebook = `Python_AULA${match[1]}.ipynb`;
    const colabUrl =
      "https://colab.research.google.com/github/labeduc/" +
      `ciencia-de-dados/blob/main/01_python/${notebook}`;
    const content = document.querySelector("main.content");

    if (!content) return;

    const container = document.createElement("div");
    container.className = "colab-launch";

    const link = document.createElement("a");
    link.href = colabUrl;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.title = `Abrir ${notebook} no Google Colab`;
    link.setAttribute("aria-label", `Abrir ${notebook} no Google Colab`);

    const badge = document.createElement("img");
    badge.src = "https://colab.research.google.com/assets/colab-badge.svg";
    badge.alt = "Abrir no Google Colab";
    badge.loading = "eager";

    link.appendChild(badge);
    container.appendChild(link);
    content.prepend(container);
  });
</script>
